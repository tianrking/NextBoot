<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Alpine Linux 3.24.1 QEMU serial-console capture</title>
  <desc id="desc">QEMU and OVMF boot capture from a generated NextBoot release-media image. The highlighted line is the asserted terminal marker.</desc>
  <rect width="1120" height="440" rx="14" fill="#0f172a"/>
  <rect width="1120" height="72" rx="14" fill="#1e293b"/>
  <circle cx="38" cy="36" r="9" fill="#fb7185"/><circle cx="66" cy="36" r="9" fill="#fbbf24"/><circle cx="94" cy="36" r="9" fill="#4ade80"/>
  <text x="128" y="33" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Alpine Linux 3.24.1</text>
  <text x="128" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">QEMU + OVMF · generated GPT/exFAT release media · NVMe</text>
  <text x="42" y="100" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14">Captured 2026-09-13 02:42:33.788655 UTC · asserted boot marker highlighted</text>
  <text x="42" y="138" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"> * Cleaning /tmp directory ... [ ok ]</text>
  <text x="42" y="160" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"> * Setting hostname to localhost from /etc/hostname ... [ ok ]</text>
  <text x="42" y="182" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"> * Starting busybox syslog ... [ ok ]</text>
  <text x="42" y="204" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"> * Starting firstboot ... [ ok ]</text>
  <text x="42" y="226" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"></text>
  <text x="42" y="248" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"></text>
  <text x="42" y="270" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Welcome to Alpine Linux 3.24</text>
