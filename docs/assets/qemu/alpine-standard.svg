  <text x="42" y="314" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Kernel 6.18.35-0-lts on x86_64 (/dev/ttyS0)</text>
  <text x="42" y="336" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"></text>
