name: Real ISO QEMU

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/real-iso-qemu.yml"
      - "scripts/check-real-iso-qemu.py"
      - "scripts/runtime_assets.py"
      - "scripts/prepare-runtime-assets.py"
      - "scripts/create-release-media.sh"
      - "scripts/verify-runtime-media.py"
      - "docs/runtime-assets.json"
      - "scripts/qemu/**"
      - "scripts/run-qemu.sh"
      - "crates/nextboot-boot/**"
      - "crates/nextboot-fs/**"
      - "crates/nextboot-linux/**"
  schedule:
    - cron: "43 19 * * 0"
  workflow_dispatch:

concurrency:
  group: real-iso-qemu-${{ github.ref }}
  # Real-media boots can take several minutes. Keep an already-running
  # validation as evidence for its commit instead of discarding it when a
  # follow-up change lands on main.
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  real-iso-qemu:
    name: Real ISO (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: [alpine-standard, debian-13.6-netinst, fedora-44-workstation, ubuntu-26.04-server, kali-2026.2-netinst]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, firmware, and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ovmf qemu-system-x86 tar xz-utils
      - name: Install Rust target
        run: |
          rustup component add rust-src llvm-tools
          rustup target add x86_64-unknown-uefi
      - name: Boot real Linux ISOs through NextBoot
        run: python3 scripts/check-real-iso-qemu.py --case "${{ matrix.case }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-iso-${{ matrix.case }}-evidence
          path: |
            target/real-iso/*.log
            target/real-iso/*.evidence.json
