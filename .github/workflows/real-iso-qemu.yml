name: Real ISO QEMU

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/real-iso-qemu.yml"
      - "scripts/check-real-iso-qemu.py"
      - "scripts/qemu/**"
      - "scripts/run-qemu.sh"
      - "crates/nextboot-boot/**"
      - "crates/nextboot-fs/**"
      - "crates/nextboot-linux/**"
  schedule:
    - cron: "43 19 * * 0"
  workflow_dispatch:

concurrency:
  group: real-iso-qemu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  real-iso-qemu:
    name: Alpine, Ubuntu, Kali Real ISO Boot
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, firmware, and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ovmf qemu-system-x86 tar xz-utils
      - name: Install Rust target
        run: |
          rustup component add rust-src llvm-tools
          rustup target add x86_64-unknown-uefi
      - name: Boot real Linux ISOs through NextBoot
        run: python3 scripts/check-real-iso-qemu.py
