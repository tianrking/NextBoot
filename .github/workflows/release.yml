name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.0.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-media:
    name: Build Release Media
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust target
        run: |
          rustup component add rust-src llvm-tools
          rustup target add x86_64-unknown-uefi i686-unknown-uefi aarch64-unknown-uefi

      - name: Build UEFI loaders
        run: |
          TARGET=all ./scripts/build.sh release

      - name: Build burnable release images
        shell: bash
        run: |
          ./scripts/create-release-media.sh \
            --skip-build \
            --target all \
            --mode release \
            --size 7000 \
            --sector-size 512 \
            --data-fs exfat \
            --output "target/release-media/nextboot-${{ steps.version.outputs.version }}-all-uefi-universal-512b-exfat.img"

      - name: Compress and checksum
        shell: bash
        run: |
          cd target/release-media
          for image in nextboot-${{ steps.version.outputs.version }}-all-uefi-universal-512b-exfat.img; do
            xz -T0 -0 -f -k "$image"
          done
          tar -czf "nextboot-${{ steps.version.outputs.version }}-tools.tar.gz" \
            -C ../.. \
            scripts/burn-release-media.sh \
            scripts/grow-release-media.py
          sha256sum \
            nextboot-${{ steps.version.outputs.version }}-all-uefi-universal-512b-exfat.img \
            nextboot-${{ steps.version.outputs.version }}-all-uefi-universal-512b-exfat.img.xz \
            nextboot-${{ steps.version.outputs.version }}-tools.tar.gz \
            > "SHA256SUMS-${{ steps.version.outputs.version }}.txt"

      - name: Verify compressed release assets
        shell: bash
        run: |
          test -f "target/release-media/nextboot-${{ steps.version.outputs.version }}-all-uefi-universal-512b-exfat.img.xz"
          test -f "target/release-media/nextboot-${{ steps.version.outputs.version }}-tools.tar.gz"
          test -s "target/release-media/SHA256SUMS-${{ steps.version.outputs.version }}.txt"
          ls -lh target/release-media/*.img.xz target/release-media/*.tar.gz target/release-media/SHA256SUMS-${{ steps.version.outputs.version }}.txt

      - name: Remove superseded single-arch release assets
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: "${{ steps.version.outputs.version }}",
              });
            } catch (error) {
              if (error.status === 404) {
                core.info("No existing release assets to prune.");
                return;
              }
              throw error;
            }

            for (const asset of release.data.assets) {
              if (
                asset.name.includes("x86_64-unknown-uefi") ||
                asset.name.includes("all-uefi-512b-exfat") ||
                asset.name.includes("all-uefi-8gb-512b-exfat") ||
                asset.name.includes("all-uefi-32gb-512b-exfat")
              ) {
                core.info(`Deleting superseded asset ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: NextBoot ${{ steps.version.outputs.version }}
          overwrite_files: true
          body: |
            Download the universal `.img.xz` file and flash it as a whole-disk image to a USB stick, USB SSD, SD card, or external SSD.

            Recommended macOS/Linux flow: download `nextboot-${{ steps.version.outputs.version }}-tools.tar.gz`, extract it, and run `./scripts/burn-release-media.sh --image nextboot-${{ steps.version.outputs.version }}-all-uefi-universal-512b-exfat.img.xz /dev/diskX`. The burn tool writes the image and expands `NEXTDATA` to the target device in one step.

            You can also flash it from Windows, macOS, or Linux with tools such as Rufus, balenaEtcher, Raspberry Pi Imager, GNOME Disks, or another raw image writer. If your writer does not accept `.img.xz` directly, decompress it to `.img` first.

            Flashing erases the selected target device. Do not copy the `.img.xz` file into an existing USB drive; write the image to the device.

            The image contains `EFI/BOOT/BOOTX64.EFI`, `EFI/BOOT/BOOTIA32.EFI`, and `EFI/BOOT/BOOTAA64.EFI` fallback loaders for x86_64, IA32, and AArch64 UEFI firmware. Legacy BIOS is not included, and Secure Boot still requires disabled Secure Boot or an enrolled local key.

            If you use a generic image writer on large media, boot NextBoot once so it can expand the `NEXTDATA` partition to the target device. With the burn tool, open `NEXTDATA` after the command finishes, drag ISO/WIM/VHD/VHDX/IMG/EFI files into `/ISO`, and boot from the firmware UEFI boot menu.
          files: |
            target/release-media/nextboot-${{ steps.version.outputs.version }}-all-uefi-universal-512b-exfat.img.xz
            target/release-media/nextboot-${{ steps.version.outputs.version }}-tools.tar.gz
            target/release-media/SHA256SUMS-${{ steps.version.outputs.version }}.txt
