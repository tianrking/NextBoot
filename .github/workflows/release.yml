name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.0.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows-release-mount:
    name: Validate Release Media With Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse Windows physical-media scripts
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/Test-NextBootQemu.ps1',
            'scripts/Write-NextBootMedia.ps1',
            'scripts/Record-NextBootHardwareEvidence.ps1'
          ) | Where-Object { Test-Path $_ }
          if ($scripts.Count -eq 0) {
            Write-Host 'This historical release tag predates the Windows physical-media scripts.'
            exit 0
          }
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "Parsed $script"
          }
      - name: Build and mount a release-media fixture through Windows exFAT
        shell: pwsh
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          $env:PYTHON = 'python'
          & $bash -lc 'TARGET=x86_64-unknown-uefi ./scripts/build.sh release'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bash -lc './scripts/create-release-media.sh --skip-build --size 7000 --growable-max-size 131072 --output target/release-media/windows-mount-qa.img'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-windows-release-mount.py --image target/release-media/windows-mount-qa.img

  release-media:
    name: Build Release Media
    needs: windows-release-mount
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust target
        run: |
          rustup component add rust-src llvm-tools
          rustup target add x86_64-unknown-uefi i686-unknown-uefi aarch64-unknown-uefi

      - name: Build UEFI loaders
        env:
          NEXTBOOT_BUILD_ID: ${{ steps.version.outputs.version }}
        run: |
          TARGET=all ./scripts/build.sh release

      - name: Build burnable release images
        shell: bash
        run: |
          ./scripts/create-release-media.sh \
            --skip-build \
            --target all \
            --mode release \
            --size 7000 \
            --sector-size 512 \
            --data-fs exfat \
            --output "target/release-media/nextboot-${{ steps.version.outputs.version }}-universal-uefi.img"
          cp scripts/Write-NextBootMedia.ps1 "target/release-media/nextboot-${{ steps.version.outputs.version }}-windows-writer.ps1"

      - name: Package matching sources and license materials
        run: python3 scripts/package-release-sources.py --version "${{ steps.version.outputs.version }}"

      - name: Compress and checksum
        shell: bash
        run: |
          cd target/release-media
          for image in nextboot-${{ steps.version.outputs.version }}-universal-uefi.img; do
            xz -T0 -0 -f -k "$image"
            python3 - "$image" <<'PY'
          import sys
          import zipfile

          image = sys.argv[1]
          with zipfile.ZipFile(f"{image}.zip", "w", compression=zipfile.ZIP_DEFLATED, compresslevel=1, allowZip64=True) as archive:
              archive.write(image, arcname=image)
          PY
          done
          sha256sum \
            nextboot-${{ steps.version.outputs.version }}-universal-uefi.img \
            nextboot-${{ steps.version.outputs.version }}-universal-uefi.img.xz \
            nextboot-${{ steps.version.outputs.version }}-universal-uefi.img.zip \
            nextboot-${{ steps.version.outputs.version }}-windows-writer.ps1 \
            nextboot-${{ steps.version.outputs.version }}-source.tar.gz \
            ventoy-*-source.tar.gz \
            > "SHA256SUMS-${{ steps.version.outputs.version }}.txt"

      - name: Verify compressed release assets
        shell: bash
        run: |
          test -f "target/release-media/nextboot-${{ steps.version.outputs.version }}-universal-uefi.img.xz"
          test -f "target/release-media/nextboot-${{ steps.version.outputs.version }}-universal-uefi.img.zip"
          test -f "target/release-media/nextboot-${{ steps.version.outputs.version }}-windows-writer.ps1"
          test -s "target/release-media/SHA256SUMS-${{ steps.version.outputs.version }}.txt"
          ls -lh target/release-media/*.img.xz target/release-media/*.img.zip target/release-media/SHA256SUMS-${{ steps.version.outputs.version }}.txt

      - name: Remove superseded single-arch release assets
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: "${{ steps.version.outputs.version }}",
              });
            } catch (error) {
              if (error.status === 404) {
                core.info("No existing release assets to prune.");
                return;
              }
              throw error;
            }

            for (const asset of release.data.assets) {
              if (
                asset.name.includes("x86_64-unknown-uefi") ||
                asset.name.includes("all-uefi-universal-512b-exfat") ||
                asset.name.includes("all-uefi-512b-exfat") ||
                asset.name.includes("all-uefi-8gb-512b-exfat") ||
                asset.name.includes("all-uefi-32gb-512b-exfat") ||
                asset.name.includes("tools.tar.gz")
              ) {
                core.info(`Deleting superseded asset ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

      - name: Publish and verify GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes=target/release-media/release-notes.md
          cat > "$notes" <<'EOF'
          Download the universal release image and flash it as a whole-disk image to an 8GB-or-larger USB stick, USB SSD, SD card, or external SSD.

          On Windows, download the `.img.zip`, extract the `.img`, then use the attached `nextboot-*-windows-writer.ps1` from Administrator PowerShell. By default it writes the whole image and verifies the full written range before reporting success. `-SkipFullVerification` is available for a time-sensitive boot experiment; it still verifies the exFAT boot record and immutable EFI partition but skips the full readback. A normal raw-image flasher remains supported, but do not use a device that Windows reports as RAW after flashing.

          balenaEtcher and Raspberry Pi Imager can commonly flash compressed images directly. Rufus and Win32 Disk Imager expect a raw `.img`; if Rufus asks for a mode, choose DD/raw image mode. Flashing erases the selected target device.

          The image contains x86_64, IA32, and AArch64 UEFI fallback loaders. Legacy BIOS is not included. Secure Boot requires disabled Secure Boot or an enrolled local key.

          After flashing, open `NEXTDATA`, drag ISO/WIM/VHD/VHDX/IMG/EFI files into `/ISO`, and boot from the firmware UEFI boot menu. On media larger than the release image, NextBoot can expand `NEXTDATA` on first boot.

          This prerelease has Windows native exFAT mount/write verification and Linux QEMU/OVMF boot-marker evidence. It does not certify completed OS installation, physical-device behavior, Windows/WinPE official media, Secure Boot, or unlisted distributions.

          The compatibility runtime is included under `/ventoy`; preserve this directory. Matching NextBoot and pinned Ventoy source archives are attached. External components retain their respective licenses.
          EOF

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "NextBoot $VERSION" "${prerelease_args[@]}" --notes-file "$notes"
          else
            gh release create "$VERSION" --title "NextBoot $VERSION" "${prerelease_args[@]}" --notes-file "$notes"
          fi

          assets=(
            "target/release-media/nextboot-$VERSION-universal-uefi.img.xz"
            "target/release-media/nextboot-$VERSION-universal-uefi.img.zip"
            "target/release-media/nextboot-$VERSION-windows-writer.ps1"
            "target/release-media/SHA256SUMS-$VERSION.txt"
            "target/release-media/nextboot-$VERSION-source.tar.gz"
          )
          assets+=(target/release-media/ventoy-*-source.tar.gz)
          gh release upload "$VERSION" --clobber "${assets[@]}"

          for asset in "${assets[@]}"; do
            name=$(basename "$asset")
            gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -Fx -- "$name"
          done
