name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.0.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-media:
    name: Build Release Media
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust target
        run: |
          rustup component add rust-src llvm-tools
          rustup target add x86_64-unknown-uefi i686-unknown-uefi aarch64-unknown-uefi

      - name: Build UEFI loaders
        run: |
          TARGET=all ./scripts/build.sh release

      - name: Build burnable release images
        shell: bash
        run: |
          ./scripts/create-release-media.sh \
            --skip-build \
            --target all \
            --mode release \
            --size 7000 \
            --sector-size 512 \
            --data-fs exfat \
            --output "target/release-media/nextboot-${{ steps.version.outputs.version }}-universal-uefi.img"

      - name: Compress and checksum
        shell: bash
        run: |
          cd target/release-media
          for image in nextboot-${{ steps.version.outputs.version }}-universal-uefi.img; do
            xz -T0 -0 -f -k "$image"
            python3 - "$image" <<'PY'
          import sys
          import zipfile

          image = sys.argv[1]
          with zipfile.ZipFile(f"{image}.zip", "w", compression=zipfile.ZIP_DEFLATED, compresslevel=1, allowZip64=True) as archive:
              archive.write(image, arcname=image)
          PY
          done
          sha256sum \
            nextboot-${{ steps.version.outputs.version }}-universal-uefi.img \
            nextboot-${{ steps.version.outputs.version }}-universal-uefi.img.xz \
            nextboot-${{ steps.version.outputs.version }}-universal-uefi.img.zip \
            > "SHA256SUMS-${{ steps.version.outputs.version }}.txt"

      - name: Verify compressed release assets
        shell: bash
        run: |
          test -f "target/release-media/nextboot-${{ steps.version.outputs.version }}-universal-uefi.img.xz"
          test -f "target/release-media/nextboot-${{ steps.version.outputs.version }}-universal-uefi.img.zip"
          test -s "target/release-media/SHA256SUMS-${{ steps.version.outputs.version }}.txt"
          ls -lh target/release-media/*.img.xz target/release-media/*.img.zip target/release-media/SHA256SUMS-${{ steps.version.outputs.version }}.txt

      - name: Remove superseded single-arch release assets
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: "${{ steps.version.outputs.version }}",
              });
            } catch (error) {
              if (error.status === 404) {
                core.info("No existing release assets to prune.");
                return;
              }
              throw error;
            }

            for (const asset of release.data.assets) {
              if (
                asset.name.includes("x86_64-unknown-uefi") ||
                asset.name.includes("all-uefi-universal-512b-exfat") ||
                asset.name.includes("all-uefi-512b-exfat") ||
                asset.name.includes("all-uefi-8gb-512b-exfat") ||
                asset.name.includes("all-uefi-32gb-512b-exfat") ||
                asset.name.includes("tools.tar.gz")
              ) {
                core.info(`Deleting superseded asset ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: NextBoot ${{ steps.version.outputs.version }}
          overwrite_files: true
          body: |
            Download the universal release image and flash it as a whole-disk image to an 8GB-or-larger USB stick, USB SSD, SD card, or external SSD.

            Recommended GUI flow: use balenaEtcher, Raspberry Pi Imager, Rufus, Win32 Disk Imager, GNOME Disks, or another raw-image flasher. Select the NextBoot image, select the target device, and flash/write it.

            balenaEtcher and Raspberry Pi Imager can commonly flash compressed images directly. Rufus and Win32 Disk Imager expect a raw `.img`; if your flasher does not accept `.img.xz`, download the `.img.zip`, extract it, then select the extracted `.img`. If Rufus asks for a mode, choose DD/raw image mode.

            Flashing erases the selected target device. Do not copy the `.img.xz` or `.img.zip` file into an existing USB drive; write the image to the whole device.

            The image contains `EFI/BOOT/BOOTX64.EFI`, `EFI/BOOT/BOOTIA32.EFI`, and `EFI/BOOT/BOOTAA64.EFI` fallback loaders for x86_64, IA32, and AArch64 UEFI firmware. Legacy BIOS is not included, and Secure Boot still requires disabled Secure Boot or an enrolled local key.

            After flashing, open `NEXTDATA`, drag ISO/WIM/VHD/VHDX/IMG/EFI files into `/ISO`, and boot from the firmware UEFI boot menu. On media larger than the release image, NextBoot can expand `NEXTDATA` on first boot.
          files: |
            target/release-media/nextboot-${{ steps.version.outputs.version }}-universal-uefi.img.xz
            target/release-media/nextboot-${{ steps.version.outputs.version }}-universal-uefi.img.zip
            target/release-media/SHA256SUMS-${{ steps.version.outputs.version }}.txt
