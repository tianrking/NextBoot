name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  health:
    name: Health Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        run: |
          rustup component add rust-src llvm-tools
          rustup target add x86_64-unknown-uefi
      - name: Run project health checks
        run: scripts/check-project-health.py

  uefi-builds:
    name: UEFI Check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-uefi
          - i686-unknown-uefi
          - aarch64-unknown-uefi
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: |
          rustup component add rust-src llvm-tools
          rustup target add "${{ matrix.target }}"
      - name: Check UEFI target
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/build.sh check

  qemu-image-matrix:
    name: QEMU Image Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: |
          rustup component add rust-src llvm-tools
          rustup target add x86_64-unknown-uefi
      - name: Generate and verify QEMU images
        run: python3 scripts/check-qemu-image-matrix.py

  qemu-smoke-default:
    name: QEMU Smoke Default
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ovmf qemu-system-x86
      - name: Install Rust target
        run: |
          rustup component add rust-src llvm-tools
          rustup target add x86_64-unknown-uefi
      - name: Run default QEMU smoke matrix
        env:
          NEXTBOOT_QEMU_TIMEOUT: "60"
        run: scripts/qemu-smoke-matrix.sh

  release-runtime:
    name: Release Runtime Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build release loader
        run: scripts/build.sh release
      - name: Build and inspect official runtime bundle
        run: |
          scripts/create-release-media.sh --skip-build --size 256 --growable-max-size 512 \
            --output target/release-media/runtime-qa.img
          python3 scripts/verify-runtime-media.py target/release-media/runtime-qa.img
      - name: Migrate runtime and verify rollback with real artifacts
        run: python3 scripts/check-media-update-integration.py --offline
      - name: Validate host updating on real FAT and exFAT volumes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" dosfstools exfatprogs
          sudo modprobe exfat
            for data_fs in exfat fat32; do
            scripts/create-release-media.sh --skip-build --without-runtime --size 256 --growable-max-size 512 \
              --data-fs "$data_fs" --output "target/release-media/$data_fs/update-volume-qa.img"
            sudo python3 scripts/check-media-update-volume.py --data-fs "$data_fs" \
                --image "target/release-media/$data_fs/update-volume-qa.img"
            done
            # Check generated non-ASCII names and all runtime directory entries
            # with the operating system, then update and restore old runtime bytes.
            printf 'Unicode name fixture\n' > target/release-media/straße-é-中文.iso
            scripts/create-release-media.sh --skip-build --size 256 --growable-max-size 512 \
              --image target/release-media/straße-é-中文.iso \
              --output target/release-media/populated/update-volume-qa.img
            sudo python3 scripts/check-media-update-volume.py --existing-runtime \
              --image target/release-media/populated/update-volume-qa.img
